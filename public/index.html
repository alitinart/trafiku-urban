<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trafiku Urban · Prishtina live buses</title>
    <meta name="description" content="Live 3D map of Prishtina city buses. Tap a bus to see its route, tap a stop to see what's arriving." />
    <meta name="theme-color" content="#ECEEEA" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trafiku" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Trafiku Urban · Prishtina live buses" />
    <meta property="og:description" content="All 19 Prishtina bus lines moving on a 3D map. Tap a stop for arrival times." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #ECEEEA; overscroll-behavior: none; }
      body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
      /* browser surfaces, themed from the palette */
      ::selection { background: #B8F23A; color: #1D2A05; }
      input { caret-color: #15171A; }
      :focus { outline: none; }
      :focus-visible { outline: 2px solid #15171A; outline-offset: 2px; border-radius: 12px; }
      input:focus, input:focus-visible, textarea:focus, textarea:focus-visible { outline: none; }
      * { scrollbar-width: thin; scrollbar-color: #C9CCC6 transparent; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb { background: #C9CCC6; border-radius: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      /* Boot skeleton: paints in the first frame, before any JS. Removed when the map is ready. */
      #boot { position: fixed; inset: 0; z-index: 10; pointer-events: none; transition: opacity .32s cubic-bezier(.2,.8,.2,1); }
      #boot.gone { opacity: 0; }
      #boot .bar { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 12px); height: 52px; border-radius: 26px; background: #fff; box-shadow: 0 1px 2px rgba(21,23,26,.06), 0 8px 24px rgba(21,23,26,.1); }
      #boot .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 196px; border-radius: 24px 24px 0 0; background: #fff; box-shadow: 0 -12px 32px rgba(21,23,26,.12); padding: 40px 20px; box-sizing: border-box; }
      #boot i { display: block; height: 14px; border-radius: 7px; margin-bottom: 14px; background: linear-gradient(90deg,#EEF0EC 0%,#F7F8F5 50%,#EEF0EC 100%); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
      #boot i:nth-child(1) { width: 34%; }
      #boot i:nth-child(2) { width: 80%; height: 24px; }
      #boot i:nth-child(3) { width: 58%; }
      @media (min-width: 900px) {
        #boot .bar { right: auto; width: 380px; left: 16px; top: 16px; }
        #boot .sheet { left: 16px; right: auto; width: 380px; top: 80px; bottom: auto; height: 240px; border-radius: 24px; }
      }
      @keyframes sh { to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
    </style>
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js'); });
      }
    </script>
  </head>
  <body>
    <noscript>Trafiku needs JavaScript to draw the live map.</noscript>
    <div id="boot" aria-hidden="true"><div class="bar"></div><div class="sheet"><i></i><i></i><i></i></div></div>
    <div id="root"></div>
  </body>
</html>
